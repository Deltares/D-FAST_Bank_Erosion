name: Deploy MkDocs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  release:
    types:
      - published

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy PR documentation
        uses: Deltares-research/github-actions/actions/mkdocs-deploy@mkdocs-deploy/v1
        with:
          python-version: '3.11'
          package-manager: poetry
          install-groups: docs
          trigger: pr
          deploy-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy main documentation
        uses: Deltares-research/github-actions/actions/mkdocs-deploy@mkdocs-deploy/v1
        with:
          python-version: '3.11'
          package-manager: poetry
          install-groups: docs
          trigger: main
          deploy-token: ${{ secrets.GITHUB_TOKEN }}
          main-set-default: 'false'

  deploy-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy release documentation
        uses: Deltares-research/github-actions/actions/mkdocs-deploy@mkdocs-deploy/v1
        with:
          python-version: '3.11'
          package-manager: poetry
          install-groups: docs
          trigger: release
          deploy-token: ${{ secrets.GITHUB_TOKEN }}
          release-tag: ${{ github.event.release.tag_name }}
          release-alias: latest
          release-prerelease: ${{ github.event.release.prerelease }}
