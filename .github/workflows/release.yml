name: Automated release workflow

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Branch to create release from"
        required: false
        default: "master"
      increment:
        description: "Version increment type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease-type:
        description: "Prerelease type (none for a standard release)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_branch }}

      - name: Run release
        uses: Deltares-research/github-actions/actions/release/github@ad07e425b297afd0cdca1341a7916f462a6e8a51 # github-release/v1
        with:
          release-branch: ${{ github.event.inputs.release_branch }}
          increment: ${{ github.event.inputs.increment }}
          prerelease-type: ${{ github.event.inputs['prerelease-type'] }}
          draft: ${{ github.event.inputs.draft }}
          python-version: '3.11'
          package-manager: poetry
          install-groups: 'dev docs'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-wheel: 'true'
