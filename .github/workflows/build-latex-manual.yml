name: Build LaTeX Manuals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/end-user-docs/**'
      - '.github/workflows/build-latex-manual.yml'
  workflow_run:
    workflows: ["Automated release workflow"]
    types: [completed]

jobs:
  build-manuals:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: rel
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases" --jq '.[0].tag_name')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::Could not resolve the release tag created by release.yml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ steps.rel.outputs.tag || github.ref }}

      - name: Write gitsettings
        working-directory: docs/end-user-docs
        run: |
          {
            echo "\\def\\@gitrepository{${{ github.repository }}}"
            echo "\\def\\@gitbranch{${{ steps.rel.outputs.tag || github.ref_name }}}"
            echo "\\def\\@githashlong{$(git rev-parse HEAD)}"
            echo "\\def\\@githashshort{$(git rev-parse --short HEAD)}"
          } > gitsettings

      - name: Build manuals
        uses: Deltares-research/github-actions/actions/release/latex-manual@10e7419a915092b3e9b2d38048b70d76237793db # feat/latex-manual
        with:
          python-version: '3.11'
          markdown-input-dir: ''
          latex-output-dir: docs/end-user-docs
          tex-files: dfastbe_usermanual,dfastbe_techref,dfastbe_release_notes
          latex-template-token: ${{ secrets.LATEX_TEMPLATE_TOKEN }}
          release-tag: ${{ steps.rel.outputs.tag }}
          upload-to-release: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
